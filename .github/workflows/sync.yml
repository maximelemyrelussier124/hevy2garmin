name: Sync Workouts

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch: {}
  repository_dispatch:
    types: [sync-trigger]

permissions:
  contents: read

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: pip install ".[cloud]"
      - name: Sync workouts from installation date only
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: hevy2garmin sync --since 2026-10-20
